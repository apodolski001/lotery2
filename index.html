<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anor Bank Lottery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", sans-serif;
      background: linear-gradient(135deg, #f5e6f0 0%, #faf1f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(167, 30, 74, 0.15);
      text-align: center;
    }

    .header {
      margin-bottom: 40px;
    }

    .logo {
      font-size: 48px;
      font-weight: 600;
      color: #a71e4a;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 40px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 20px solid #a71e4a;
      z-index: 20;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .wheel {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 10px 40px rgba(167, 30, 74, 0.25), inset 0 2px 8px rgba(255,255,255,0.1);
      overflow: hidden;
      border: 8px solid #f0d4e1;
    }

    .wheel svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wheel::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 2px 8px rgba(167, 30, 74, 0.3);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: #ffffff;
      color: #333;
    }

    .btn:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    .btn-spin {
      background: #a71e4a;
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
    }

    .btn-spin:hover:not(:disabled) {
      background: #8a1839;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(167, 30, 74, 0.3);
    }

    .btn-spin:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f0d4e1;
      border-radius: 8px;
      border: 1px solid #e5b3ce;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result-label {
      font-size: 12px;
      color: #a71e4a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .result-text {
      font-size: 16px;
      font-weight: 600;
      color: #a71e4a;
      line-height: 1.3;
    }

    .result.empty {
      background: #f9f9f9;
      border-color: #ddd;
      color: #999;
      font-style: italic;
    }

    .result.empty .result-label,
    .result.empty .result-text {
      color: #999;
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      z-index: 100;
    }

    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">🎲 ANOR LOTTERY</div>
    <div class="subtitle">Проверьте вашу удачу</div>
  </div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <div class="wheel">
      <svg viewBox="0 0 300 300" id="wheelSvg">
        <g id="wheelGroup" transform="translate(150, 150)">
          <!-- segments will be inserted here -->
        </g>
      </svg>
    </div>
  </div>

  <div class="button-group">
    <button class="btn-spin" id="spinBtn" onclick="spinWheel()">Вращать рулетку</button>
    <button class="btn" onclick="resetResult()">Очистить</button>
  </div>

  <div class="result empty" id="result">
    Нажмите "Вращать рулетку" для участия
  </div>
</div>

<script>
const prizes = [
  { text: 'Год без отпуска', color: '#a71e4a' },
  { text: 'Минус один грейд', color: '#c72c55' },
  { text: 'Неработающий кондиционер', color: '#8a1839' },
  { text: 'Абдуазим должен быть во всех рапортах', color: '#d63a67' },
  { text: 'Доступ к Mattermost только через провод', color: '#9b2244' },
  { text: 'Доступ к БД только со стационара', color: '#7f1635' },
  { text: 'Встречи в 6 утра каждый день', color: '#b82a52' },
  { text: 'Все документы только на печатной машинке', color: '#a71e4a' },
  { text: 'Все сообщения отправлять голосовыми', color: '#c72c55' },
  { text: 'Обязательная камера на всех звонках', color: '#8a1839' },
  { text: 'Рабочий экран на телевизоре у А. Рустамовича', color: '#d63a67' }
];

let isSpinning = false;
let currentRotation = 0;

function initWheel() {
  const wheelGroup = document.getElementById('wheelGroup');
  wheelGroup.innerHTML = '';
  
  const segmentAngle = 360 / prizes.length;
  const radius = 140;
  
  prizes.forEach((prize, index) => {
    const startAngle = (index * segmentAngle - 90) * Math.PI / 180;
    const endAngle = ((index + 1) * segmentAngle - 90) * Math.PI / 180;
    
    const x1 = radius * Math.cos(startAngle);
    const y1 = radius * Math.sin(startAngle);
    const x2 = radius * Math.cos(endAngle);
    const y2 = radius * Math.sin(endAngle);
    
    const largeArc = segmentAngle > 180 ? 1 : 0;
    const pathData = `M 0 0 L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathData);
    path.setAttribute('fill', prize.color);
    path.setAttribute('stroke', '#fff');
    path.setAttribute('stroke-width', '2');
    
    wheelGroup.appendChild(path);
  });
}

function spinWheel() {
  if (isSpinning) return;
  
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').classList.add('empty');
  document.getElementById('result').innerHTML = 'Крутим... 🎯';
  
  const wheelGroup = document.getElementById('wheelGroup');
  
  const spins = 8 + Math.random() * 2;
  const randomExtra = Math.random() * 360;
  const totalRotation = spins * 360 + randomExtra;
  
  const startTime = Date.now();
  const duration = 2000;
  
  const animate = () => {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    
    const easeOutQuad = 1 - (1 - progress) * (1 - progress);
    const rotation = totalRotation * easeOutQuad;
    
    wheelGroup.setAttribute('transform', `translate(150, 150) rotate(${rotation})`);
    
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentRotation = (currentRotation + totalRotation) % 360;
      
      const normalizedRotation = 360 - ((currentRotation) % 360);
      const segmentAngle = 360 / prizes.length;
      const prizeIndex = Math.floor(normalizedRotation / segmentAngle) % prizes.length;
      
      setTimeout(() => {
        displayResult(prizeIndex);
        createConfetti();
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
      }, 300);
    }
  };
  
  animate();
}

function displayResult(index) {
  const prize = prizes[index];
  const result = document.getElementById('result');
  result.classList.remove('empty');
  result.innerHTML = `
    <div class="result-label">🏆 Ваш приз:</div>
    <div class="result-text">${prize.text}</div>
  `;
}

function resetResult() {
  document.getElementById('result').classList.add('empty');
  document.getElementById('result').innerHTML = 'Нажмите "Вращать рулетку" для участия';
}

function createConfetti() {
  const confettiPieces = ['🎉', '🎊', '💔', '😅', '⚠️'];
  
  for (let i = 0; i < 15; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.textContent = confettiPieces[Math.floor(Math.random() * confettiPieces.length)];
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = '50%';
    confetti.style.animation = `confetti-fall ${1 + Math.random() * 1.5}s ease-out forwards`;
    document.body.appendChild(confetti);
    
    setTimeout(() => confetti.remove(), 3000);
  }
}

initWheel();
</script>

</body>
</html>
